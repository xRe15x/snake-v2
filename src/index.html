<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Snake v2</h1>
        <ul>
            <li>
                <div class="change-theme-container">
                    <button id="change-theme">Theme</button>
                    <ul id="theme-dropdown">
                        <li><button>light</button></li>
                        <li><button>dark</button></li>
                    </ul>
                </div>
            </li>
        </ul>
    </header>

    <main>
        <div class="main-container">
            <div class="canvas-container">
                <div id="death-screen">
                    <h2>You lost!</h2>
                    <p id="death-screen-score">You achieved a new best score of 999</p>
                    <button id="restart">Restart</button>
                </div>
                <canvas id="game" width="600" height="400"></canvas>
            </div>
            <ul id="game-info">
                <li id="score">Score: 999</li>
                <li id="best-score">Best: 999</li>
            </ul>
        </div>
    </main>
</body>
</html>
